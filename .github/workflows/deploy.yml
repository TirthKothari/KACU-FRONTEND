# This workflow deploys your React app to Vercel's production environment
# when you push to the 'dev' branch.

name: Deploy to Vercel (Production)

on:
  push:
    branches:
      - dev # Trigger the workflow on push to the 'dev' branch

jobs:
  # This job runs linting and formatting checks first
  lint-and-check:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Specify your project's Node.js version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Use 'ci' for cleaner, faster installs in CI

      - name: Run ESLint
        run: npm run lint # Assumes you have a 'lint' script in package.json

      - name: Run Prettier Check
        run: npm run check-format # Assumes you have a 'check-format' script

  # This job deploys to Vercel, but only if 'lint-and-check' succeeds
  deploy-to-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-check # Ensures linting passes before deploying
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Settings
        # This command links the local directory to your Vercel project
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        # This builds the project optimized for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        # This deploys the prebuilt output to Vercel's production environment
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

    env:
      # Pass the secrets to the Vercel CLI
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}